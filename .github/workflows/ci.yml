name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate repository
        run: |
          test -f README.md
          test -d docs
          test -d api
          test -d database
          test -d workflows
          test -d tests
